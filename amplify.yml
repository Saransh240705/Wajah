version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - node --version
            - npm --version
            # Install from monorepo root so all workspaces (shared, api, web) are linked
            - npm install
        build:
          commands:
            - npm run build -w @wajah/web
      artifacts:
        # Next.js standalone + static output
        baseDirectory: web/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - web/.next/cache/**/*
    appRoot: .
