version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            # Install from monorepo root so @wajah/shared workspace is linked
            - cd ..
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        # baseDirectory is relative to appRoot (web/)
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../node_modules/**/*
          - .next/cache/**/*
