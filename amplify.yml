version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - node --version
            - npm --version
            # Install from monorepo root so @wajah/shared workspace is linked
            - npm install
        build:
          commands:
            - npm run build -w @wajah/web
            # Copy static assets into the standalone server bundle
            - cp -r web/public web/.next/standalone/web/public
            - cp -r web/.next/static web/.next/standalone/web/.next/static
      artifacts:
        # Serve the standalone Node.js server (Amplify SSR)
        baseDirectory: web/.next/standalone
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - web/.next/cache/**/*
    appRoot: .
